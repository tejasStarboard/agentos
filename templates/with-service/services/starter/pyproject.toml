[project]
name = "starter"
version = "0.0.0"
description = "AgentOS starter Python service (FastAPI + agentos SDK)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
dependencies = [
  "agentos",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.0.0",
]

[tool.uv.sources]
# Assumes app created under examples/<name>/ (monorepo). Adjust if your path differs.
agentos = { path = "../../../../packages/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
