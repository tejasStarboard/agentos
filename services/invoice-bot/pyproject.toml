[project]
name = "invoice-bot"
version = "0.0.0"
description = "AgentOS sample invoice-bot Python service"
requires-python = ">=3.11"
dependencies = [
  "agentos",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.0.0",
]

[tool.uv.sources]
agentos = { path = "../../packages/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
