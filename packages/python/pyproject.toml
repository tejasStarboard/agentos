[project]
name = "agentos"
version = "0.0.0"
description = "AgentOS Python SDK for services/ (mirrors @agentos/core/api domains)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/tejasStarboard/agentos/tree/main/packages/python"
Repository = "https://github.com/tejasStarboard/agentos"
Issues = "https://github.com/tejasStarboard/agentos/issues"
Documentation = "https://github.com/tejasStarboard/agentos/blob/main/.project/docs/services.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "respx>=0.21.0",
  "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentos"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
